blueprint:
  name: Sunrise Light Simulator
  description: >
    Gradually brighten lights and change color to simulate a natural sunrise.
    Uses configurable step intervals (default 30 sec) with smooth transitions
    and a non-linear curve that mimics real sunrise progression.
  domain: automation
  input:
    target_lights:
      name: Lights
      description: Select lights by entity, area, device, or label for the sunrise simulation
      selector:
        target: {}
    start_time:
      name: Start Time
      description: Time to start the sunrise simulation
      selector:
        time: {}
    duration:
      name: Duration (minutes)
      description: How long the sunrise should last
      default: 45
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: minutes
    days_of_week:
      name: Days of Week (Optional)
      description: Select which days to run the sunrise simulation. Leave empty to run every day.
      default: []
      selector:
        select:
          options:
            - label: Monday
              value: "mon"
            - label: Tuesday
              value: "tue"
            - label: Wednesday
              value: "wed"
            - label: Thursday
              value: "thu"
            - label: Friday
              value: "fri"
            - label: Saturday
              value: "sat"
            - label: Sunday
              value: "sun"
          multiple: true
    max_brightness:
      name: Maximum Brightness
      description: The maximum brightness level to reach at the end of the sunrise
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    startup_brightness:
      name: Startup Brightness (%)
      description: Initial brightness when the sunrise simulation starts. Some lights (especially Govee) have issues with very low startup commands. Try 5-10% instead of 1% if your light flickers or doesn't respond at startup.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    start_color_temp:
      name: Starting Color Temperature
      description: The warm color to start the sunrise with. Presets are suggested values; use custom kelvin for fine-tuning (1800-6500K).
      default: "2000"
      selector:
        select:
          options:
            - label: "Candlelight (1800K)"
              value: "1800"
            - label: "Warm White (2000K) - Recommended"
              value: "2000"
            - label: "Soft White (2700K)"
              value: "2700"
            - label: "Neutral (3000K)"
              value: "3000"
          custom_value: true
    end_color_temp:
      name: Ending Color Temperature
      description: The cool daylight color to end the sunrise with. Presets are suggested values; use custom kelvin for fine-tuning (1800-6500K).
      default: "5500"
      selector:
        select:
          options:
            - label: "Neutral (3000K)"
              value: "3000"
            - label: "Cool White (4000K)"
              value: "4000"
            - label: "Daylight (5000K)"
              value: "5000"
            - label: "Bright Daylight (5500K) - Recommended"
              value: "5500"
            - label: "Bright Cool Daylight (6500K)"
              value: "6500"
          custom_value: true
    step_interval:
      name: Step Interval (seconds)
      description: >
        Time between brightness changes. Lower values = smoother transitions but more service calls; higher values = more compatible with all lights.
        Device recommendations: LIFX 5-10s, Philips Hue 10-15s, Govee/MQTT 15-30s, Generic dimmers 10-20s.
        If you see jarring transitions, try increasing this value.
      default: 30
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: seconds
    pre_sunrise_actions:
      name: Pre-Sunrise Actions (Optional)
      description: Actions to run before the sunrise simulation starts
      default: []
      selector:
        action: {}
    post_sunrise_actions:
      name: Post-Sunrise Actions (Optional)
      description: Actions to run after the sunrise simulation completes
      default: []
      selector:
        action: {}

trigger:
  - platform: time
    at: !input start_time

condition:
  - condition: template
    value_template: "{{ days_of_week | length == 0 or now().strftime('%a').lower()[:3] in days_of_week }}"

variables:
  duration: !input duration
  max_brightness: !input max_brightness
  step_interval: !input step_interval
  startup_brightness: !input startup_brightness
  days_of_week: !input days_of_week
  start_color_temp: !input start_color_temp
  end_color_temp: !input end_color_temp
  total_steps: "{{ (duration * 60 / step_interval) | int }}"
  start_kelvin: "{{ start_color_temp | int(2000) }}"
  end_kelvin: "{{ end_color_temp | int(5500) }}"
  target_lights: !input target_lights
  monitor_entity: >
    {% if target_lights.entity_id is defined %}
      {% if target_lights.entity_id is string %}
        {{ target_lights.entity_id }}
      {% else %}
        {{ target_lights.entity_id[0] }}
      {% endif %}
    {% else %}
      none
    {% endif %}

action:
  - choose: []
    default: !input pre_sunrise_actions

  - action: light.turn_on
    target: !input target_lights
    data:
      brightness_pct: "{{ startup_brightness }}"
      color_temp_kelvin: "{{ start_kelvin }}"
    continue_on_error: true

  - delay:
      seconds: 2

  - repeat:
      while:
        - condition: template
          value_template: "{{ repeat.index <= total_steps }}"
        - condition: template
          value_template: "{{ monitor_entity == 'none' or is_state(monitor_entity, 'on') }}"
      sequence:
        - action: light.turn_on
          target: !input target_lights
          data:
            brightness_pct: "{{ (startup_brightness + (max_brightness - startup_brightness) * ((repeat.index / total_steps) ** 1.3)) | int }}"
            color_temp_kelvin: "{{ (start_kelvin + (end_kelvin - start_kelvin) * (1 - ((1 - repeat.index / total_steps) ** 1.5))) | int }}"
            transition: "{{ step_interval }}"
          continue_on_error: true

        - delay:
            seconds: "{{ step_interval }}"

  - condition: template
    value_template: "{{ monitor_entity == 'none' or is_state(monitor_entity, 'on') }}"

  - action: light.turn_on
    target: !input target_lights
    data:
      brightness_pct: "{{ max_brightness }}"
      color_temp_kelvin: "{{ end_kelvin }}"
    continue_on_error: true

  - condition: template
    value_template: "{{ monitor_entity == 'none' or is_state(monitor_entity, 'on') }}"

  - choose: []
    default: !input post_sunrise_actions

mode: single
